
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сбор информации о NFT | Martian Clan</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/TribeInfoCollector.css">
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">
            <h1>Martian Clan</h1>
        </div>
      
    </div>

    <div class="collector-container">
        <div class="collector-header">  
            <h1>
                <span class="title-icon"></span>🔄</span>
                 Сбор информации о NFT
                <p class="subtitle">Автоматический сбор данных о NFT коллекции</p>
            </h1>
            <a href="/" class="sort-back-btn">← На главную</a>
        </div>

        <!-- Уведомления -->
        <div id="notifications-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>

        <!-- Информация о статусе -->
        <div class="module-info">
            <h3>📋 Статус</h3>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Всего NFT в коллекции</span>
                    <span class="info-value" id="total-in-collection">0</span>
                </div>    
                <div class="info-item">
                    <span class="info-label">Последнее обновление</span>
                    <span class="info-value" id="last-updated">Никогда</span>
                </div>
            </div>
        </div>

        <!-- Прогресс сбора -->
        <div class="progress-section">
            <h3>📊 Прогресс сбора</h3>
            <div class="progress-container">
                <div class="progress-bar" id="collection-progress" style="width: 0%">0%</div>
            </div>
            <div class="progress-info">
                <div class="progress-text" id="progress-text">Готов к запуску</div>
            </div>
        </div>

        <!-- Управление -->
        <div class="controls-section">
            <h3>🎮 Управление сбором</h3>
            
            <div class="controls-grid">
                <button class="btn btn-primary btn-wide" id="start-collection">
                    🚀 Запустить сбор
                </button>
                
                <button class="btn btn-danger btn-wide" id="stop-collection" disabled>
                    ⏹️ Остановить сбор
                </button>
                
                <button class="btn btn-info btn-wide" id="check-integrity">
                    🔍 Проверить целостность
                </button>
            </div>
        </div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/TribeInfoCollector.js"></script>
    
</body>
</html>
